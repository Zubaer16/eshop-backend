products:
  get:
    summary: Get all products (USER, ADMIN, DELIVERY)
    tags:
      - Products
    security:
      - bearerAuth: []
    parameters:
      - $ref: '#/components/parameters/PageParam'
      - $ref: '#/components/parameters/LimitParam'
      - $ref: '#/components/parameters/SearchParam'
      - $ref: '#/components/parameters/CategoryIdParam'
      - $ref: '#/components/parameters/MinPriceParam'
      - $ref: '#/components/parameters/MaxPriceParam'
      - $ref: '#/components/parameters/InStockParam'
      - $ref: '#/components/parameters/OnSaleParam'
    responses:
      '200':
        description: Products retrieved successfully
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaginatedProducts'
      '401':
        description: Unauthorized

  post:
    summary: Create a new product (ADMIN)
    tags:
      - Products
    security:
      - bearerAuth: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/CreateProductRequest'
    responses:
      '201':
        description: Product created successfully
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Product'
      '401':
        description: Unauthorized
      '403':
        description: Forbidden - Admin only

productById:
  get:
    summary: Get product by ID (USER, ADMIN, DELIVERY)
    tags:
      - Products
    security:
      - bearerAuth: []
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    responses:
      '200':
        description: Product retrieved successfully
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Product'
      '404':
        description: Product not found

  patch:
    summary: Update a product (ADMIN)
    tags:
      - Products
    security:
      - bearerAuth: []
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/UpdateProductRequest'
    responses:
      '200':
        description: Product updated successfully
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Product'
      '401':
        description: Unauthorized
      '403':
        description: Forbidden - Admin only
      '404':
        description: Product not found

  delete:
    summary: Delete a product (ADMIN)
    tags:
      - Products
    security:
      - bearerAuth: []
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    responses:
      '204':
        description: Product deleted successfully (no content)
      '401':
        description: Unauthorized
      '403':
        description: Forbidden - Admin only
      '404':
        description: Product not found

productBySlug:
  get:
    summary: Get product by slug (USER, ADMIN, DELIVERY)
    tags:
      - Products
    security:
      - bearerAuth: []
    parameters:
      - name: slug
        in: path
        required: true
        schema:
          type: string
    responses:
      '200':
        description: Product retrieved successfully
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Product'
      '404':
        description: Product not found