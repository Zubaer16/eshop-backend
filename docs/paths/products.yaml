products:
  get:
    summary: Get all products (USER, ADMIN, DELIVERY)
    description: Returns a paginated product list. Supports search, category, price, stock, and sale filters.
    tags:
      - Products
    security:
      - bearerAuth: []
    parameters:
      - $ref: '#/components/parameters/PageParam'
      - $ref: '#/components/parameters/LimitParam'
      - $ref: '#/components/parameters/SearchParam'
      - $ref: '#/components/parameters/CategoryIdParam'
      - $ref: '#/components/parameters/MinPriceParam'
      - $ref: '#/components/parameters/MaxPriceParam'
      - $ref: '#/components/parameters/InStockParam'
      - $ref: '#/components/parameters/OnSaleParam'
    responses:
      '200':
        description: Products retrieved successfully
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaginatedProductsResponse'
            example:
              success: true
              data:
                products:
                  - id: "8a3a4fcb-8e02-4c29-bc5f-b34d23d740c1"
                    name: Wireless Mouse
                    slug: wireless-mouse
                    description: Ergonomic wireless mouse
                    originalPrice: 1200
                    salePrice: 999
                    stock: 25
                    categoryId: "57dbb6b5-2dfd-4f9e-a8a2-b25f807a9447"
                    isOnSale: true
                    saleStartDate: "2026-05-01T00:00:00.000Z"
                    saleEndDate: "2026-06-01T00:00:00.000Z"
                    isActive: true
                    createdAt: "2026-05-25T10:00:00.000Z"
                    updatedAt: "2026-05-25T10:00:00.000Z"
                total: 1
                page: 1
                limit: 10
                totalPages: 1
      '400':
        description: Validation error
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Error'
            example:
              success: false
              error:
                message: minPrice must be less than or equal to maxPrice
      '401':
        description: Unauthorized
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Error'
            example:
              success: false
              error:
                message: Authentication token is missing

  post:
    summary: Create a new product (ADMIN)
    description: Creates a new product. Requires an authenticated admin user.
    tags:
      - Products
    security:
      - bearerAuth: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/CreateProductRequest'
          example:
            name: Wireless Mouse
            slug: wireless-mouse
            description: Ergonomic wireless mouse
            originalPrice: 1200
            salePrice: 999
            stock: 25
            categoryId: "57dbb6b5-2dfd-4f9e-a8a2-b25f807a9447"
            isOnSale: true
            saleStartDate: "2026-05-01T00:00:00.000Z"
            saleEndDate: "2026-06-01T00:00:00.000Z"
            isActive: true
    responses:
      '201':
        description: Product created successfully
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductResponse'
            example:
              success: true
              data:
                product:
                  id: "8a3a4fcb-8e02-4c29-bc5f-b34d23d740c1"
                  name: Wireless Mouse
                  slug: wireless-mouse
                  description: Ergonomic wireless mouse
                  originalPrice: 1200
                  salePrice: 999
                  stock: 25
                  categoryId: "57dbb6b5-2dfd-4f9e-a8a2-b25f807a9447"
                  isOnSale: true
                  saleStartDate: "2026-05-01T00:00:00.000Z"
                  saleEndDate: "2026-06-01T00:00:00.000Z"
                  isActive: true
                  createdAt: "2026-05-25T10:00:00.000Z"
                  updatedAt: "2026-05-25T10:00:00.000Z"
      '400':
        description: Validation error
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Error'
            example:
              success: false
              error:
                message: Invalid product payload
      '401':
        description: Unauthorized
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Error'
            example:
              success: false
              error:
                message: Authentication token is missing
      '403':
        description: Forbidden - Admin only
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Error'
            example:
              success: false
              error:
                message: "Forbidden: Insufficient permissions"

productById:
  get:
    summary: Get product by ID (USER, ADMIN, DELIVERY)
    description: Returns a single product by UUID.
    tags:
      - Products
    security:
      - bearerAuth: []
    parameters:
      - name: id
        in: path
        required: true
        description: Product UUID.
        schema:
          type: string
          format: uuid
        example: "8a3a4fcb-8e02-4c29-bc5f-b34d23d740c1"
    responses:
      '200':
        description: Product retrieved successfully
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductResponse'
